<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Sign in to your Alif Laam Meem Jewellers account.">
  <title>Sign in | Alif Laam Meem Jewellers</title>
  <link rel="icon" href="assets/logo-icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page auth-page--signin">
  <nav class="navbar" id="navbar" aria-label="Primary">
    <div class="container nav-container">
      <a class="logo logo--mark" href="index.html" aria-label="Alif Laam Meem Jewellers — home">
        <img class="logo-img logo-img--mark" src="assets/logo-icon.png" alt="" width="192" height="192" decoding="async">
        <span class="logo-words">
          <span class="logo-text">Alif Laam Meem</span>
          <span class="logo-sub">Jewellers</span>
        </span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="collections.html" class="nav-link">Collections</a>
        <a href="visit.html" class="nav-link">Visit</a>
        <a href="signup.html" class="nav-link nav-account">Sign up</a>
        <a href="appointment.html" class="btn btn-primary nav-cta">Book</a>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Toggle navigation menu"
              aria-expanded="false" aria-controls="navLinks"><span class="hamburger"></span></button>
    </div>
  </nav>

  <main class="auth-main">
    <div class="container auth-container">
      <section class="auth-card" aria-labelledby="authTitle">
        <header class="auth-heading">
          <p class="auth-eyebrow">Welcome back</p>
          <h1 class="auth-title" id="authTitle">Sign in to your account.</h1>
          <p class="auth-intro">Pick up where you left off with Alif Laam Meem.</p>
        </header>

        <button class="btn google-btn" id="googleButton" type="button"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>Continue with Google</span></button>
        <p class="auth-divider"><span>or sign in with email</span></p>

        <form class="auth-form" id="signupForm" aria-label="Sign in" method="post">

          <div class="auth-field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" autocapitalize="none" spellcheck="false" required>
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>
          </div>

          <button class="btn btn-primary auth-submit" id="signupButton" type="submit">Sign in</button>
          <p class="auth-message" id="signupMessage" role="status" aria-live="polite" aria-atomic="true" hidden></p>
        </form>

        <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
        <p class="auth-switch"><a href="#" id="forgotLink">Forgot your password?</a></p>
        <a class="auth-back" href="index.html">&larr; Back to Alif Laam Meem</a>
      </section>
    </div>
  </main>

  <noscript>
    <p class="auth-noscript">JavaScript is required to sign in securely.</p>
  </noscript>

  <script>
    (() => {
      const button = document.getElementById('mobileMenuBtn');
      const links = document.getElementById('navLinks');
      if (!button || !links) return;

      const setMenu = (open) => {
        button.setAttribute('aria-expanded', String(open));
        links.classList.toggle('open', open);
        document.body.classList.toggle('no-scroll', open);
      };

      button.addEventListener('click', () => {
        setMenu(button.getAttribute('aria-expanded') !== 'true');
      });
      links.querySelectorAll('.nav-link').forEach((link) => {
        link.addEventListener('click', () => setMenu(false));
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && links.classList.contains('open')) {
          setMenu(false);
          button.focus();
        }
      });
      window.addEventListener('resize', () => {
        if (window.innerWidth > 860 && links.classList.contains('open')) setMenu(false);
      });
    })();
  </script>

  <script type="module">
    import { createClient } from "./vendor/supabase.js";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./supabase-config.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById("signupForm");
    const message = document.getElementById("signupMessage");
    const submitButton = document.getElementById("signupButton");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const googleButton = document.getElementById("googleButton");
    const home = new URL("index.html", window.location.href).href;

    function showMessage(text, state) {
      message.textContent = text;
      message.dataset.state = state;
      message.hidden = !text;
    }

    function friendlyError(error) {
      const original = error && error.message ? error.message : "";
      const n = original.toLowerCase();
      if (n.includes("invalid login")) return "That email and password don't match an account.";
      if (n.includes("not confirmed")) return "Please confirm your email first. Check your inbox for the link.";
      if (n.includes("too many") || n.includes("rate limit")) return "Too many attempts. Please wait a moment and try again.";
      if (n.includes("failed to fetch") || n.includes("network")) return "We couldn't reach the account service. Check your connection and try again.";
      return original || "We couldn't sign you in. Please try again.";
    }

    supabase.auth.getSession().then(({ data }) => {
      if (data.session) showMessage("You're already signed in. Taking you home…", "success"), setTimeout(() => location.replace("index.html"), 900);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("", "");
      const label = submitButton.textContent;
      submitButton.disabled = true;
      submitButton.textContent = "Signing in…";
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value
        });
        if (error) { showMessage(friendlyError(error), "error"); return; }
        showMessage("Signed in. Taking you to Alif Laam Meem…", "success");
        setTimeout(() => location.replace("index.html"), 700);
      } catch (error) {
        showMessage(friendlyError(error), "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = label;
      }
    });

    googleButton.addEventListener("click", async () => {
      showMessage("", "");
      googleButton.disabled = true;
      const { error } = await supabase.auth.signInWithOAuth({ provider: "google", options: { redirectTo: home } });
      if (error) { showMessage(friendlyError(error), "error"); googleButton.disabled = false; }
    });

    document.getElementById("forgotLink").addEventListener("click", async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      if (!email) { showMessage("Enter your email address above, then tap Forgot your password again.", "error"); emailInput.focus(); return; }
      const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: home });
      showMessage(error ? friendlyError(error) : "If that email has an account, a reset link is on its way.", error ? "error" : "success");
    });

    form.addEventListener("input", () => showMessage("", ""));
  </script>
</body>
</html>
