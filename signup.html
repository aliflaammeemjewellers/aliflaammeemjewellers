  <nav>
    <div class="logo">
      <div class="logo-mark">ALM</div>

      <div class="brand-text">
        Alif Laam Meem
        <span>Jewellers</span>
      </div>

      <a href="appointment.html" class="book-btn">Book</a>
    </div>
  </nav>

  <main class="container">

    <div class="signup-card">

      <div class="eyebrow">Welcome to Alif Laam Meem</div>

      <h1>Create your account.</h1>

      <p class="intro">
        Join Alif Laam Meem and discover our exclusive jewellery collection.
      </p>

      <form id="signupForm">

        <label for="name">Full name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >

        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >

        <button type="submit" class="create-btn">
          Create account
        </button>

        <div id="message" class="message"></div>

      </form>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Sign in</a>
      </div>

    </div>

  </main>

  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://eafqpwwpwzjdrkrtoqlz.supabase.co",
      "PASTE_YOUR_PUBLISHABLE_KEY_HERE"
    );

    const signupForm = document.getElementById("signupForm");
    const message = document.getElementById("message");

    signupForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Creating your account...";
      message.style.color = "#777";

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: name
          }
        }
      });

      if (error) {
        message.textContent = error.message;
        message.style.color = "#b00020";
        return;
      }

      message.textContent =
        "Account created successfully. Please check your email if verification is required.";

      message.style.color = "#8a681f";

      signupForm.reset();

    });

  </script>
