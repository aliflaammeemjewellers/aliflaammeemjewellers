<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Create an account with Alif Laam Meem Jewellers.">
  <title>Create an account | Alif Laam Meem Jewellers</title>
  <link rel="icon" href="assets/logo-icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page auth-page--signup">
  <nav class="navbar" id="navbar" aria-label="Primary">
    <div class="container nav-container">
      <a class="logo logo--mark" href="index.html" aria-label="Alif Laam Meem Jewellers — home">
        <img class="logo-img logo-img--mark" src="assets/logo-icon.png" alt="" width="192" height="192" decoding="async">
        <span class="logo-words">
          <span class="logo-text">Alif Laam Meem</span>
          <span class="logo-sub">Jewellers</span>
        </span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="collections.html" class="nav-link">Collections</a>
        <a href="visit.html" class="nav-link">Visit</a>
        <a href="appointment.html" class="btn btn-primary nav-cta">Book</a>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Toggle navigation menu"
              aria-expanded="false" aria-controls="navLinks"><span class="hamburger"></span></button>
    </div>
  </nav>

  <main class="auth-main">
    <div class="container auth-container">
      <section class="auth-card" aria-labelledby="authTitle">
        <header class="auth-heading">
          <p class="auth-eyebrow">A considered welcome</p>
          <h1 class="auth-title" id="authTitle">Begin your jewellery journey.</h1>
          <p class="auth-intro">Create your Alif Laam Meem account and discover the collection, thoughtfully chosen for you.</p>
        </header>

        <button class="btn google-btn" id="googleButton" type="button"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>Continue with Google</span></button>
        <p class="auth-divider"><span>or sign up with email</span></p>

        <form class="auth-form" id="signupForm" method="post">
          <div class="auth-field">
            <label for="fullName">Full name</label>
            <input id="fullName" name="full_name" type="text" placeholder="Enter your full name" autocomplete="name" maxlength="120" required>
          </div>

          <div class="auth-field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" autocapitalize="none" spellcheck="false" required>
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" minlength="6" required>
          </div>

          <button class="btn btn-primary auth-submit" id="signupButton" type="submit">Create account</button>
          <p class="auth-message" id="signupMessage" role="status" aria-live="polite" aria-atomic="true" hidden></p>
        </form>

        <p class="auth-switch">Need help with your account? <a href="visit.html">Contact us</a></p>
        <a class="auth-back" href="index.html">&larr; Back to Alif Laam Meem</a>
      </section>
    </div>
  </main>

  <noscript>
    <p class="auth-noscript">JavaScript is required to securely create an account.</p>
  </noscript>

  <script>
    (() => {
      const button = document.getElementById('mobileMenuBtn');
      const links = document.getElementById('navLinks');
      if (!button || !links) return;

      const setMenu = (open) => {
        button.setAttribute('aria-expanded', String(open));
        links.classList.toggle('open', open);
        document.body.classList.toggle('no-scroll', open);
      };

      button.addEventListener('click', () => {
        setMenu(button.getAttribute('aria-expanded') !== 'true');
      });
      links.querySelectorAll('.nav-link').forEach((link) => {
        link.addEventListener('click', () => setMenu(false));
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && links.classList.contains('open')) {
          setMenu(false);
          button.focus();
        }
      });
      window.addEventListener('resize', () => {
        if (window.innerWidth > 860 && links.classList.contains('open')) setMenu(false);
      });
    })();
  </script>

  <script type="module">
    import { createClient } from "./vendor/supabase.js";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./supabase-config.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("signupForm");
    const message = document.getElementById("signupMessage");
    const submitButton = document.getElementById("signupButton");
    const fullNameInput = document.getElementById("fullName");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    function showMessage(text, state) {
      message.textContent = text;
      message.dataset.state = state;
      message.hidden = !text;
    }

    function friendlyError(error) {
      const original = error && error.message ? error.message : "";
      const normalized = original.toLowerCase();
      if (normalized.includes("already registered") || normalized.includes("already exists")) {
        return "An account with this email address already exists. Sign in or reset your password instead.";
      }
      if (normalized.includes("password") && (normalized.includes("weak") || normalized.includes("least"))) {
        return "Please choose a stronger password that meets the account security requirements.";
      }
      if (normalized.includes("too many") || normalized.includes("rate limit")) {
        return "There have been too many attempts. Please wait a moment and try again.";
      }
      if (normalized.includes("failed to fetch") || normalized.includes("network")) {
        return "We couldn't reach the account service. Check your connection and try again.";
      }
      return original || "We couldn't create your account. Please check your details and try again.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("", "");

      const fullName = fullNameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const originalLabel = submitButton.textContent;
      submitButton.disabled = true;
      submitButton.textContent = "Creating account…";

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName
            }
          }
        });

        if (error) {
          showMessage(friendlyError(error), "error");
          return;
        }

        if (!data.user) {
          showMessage("We couldn't confirm your account was created. Please try again.", "error");
          return;
        }

        form.reset();
        if (data.session) {
          showMessage("Your account is ready. Taking you to Alif Laam Meem…", "success");
          window.setTimeout(() => window.location.replace("index.html"), 900);
        } else {
          showMessage("Your account has been created. Please check your email for a confirmation link before signing in.", "success");
        }
      } catch (error) {
        showMessage(friendlyError(error), "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = originalLabel;
      }
    });

    const googleButton = document.getElementById("googleButton");
    googleButton.addEventListener("click", async () => {
      showMessage("", "");
      googleButton.disabled = true;
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: new URL("index.html", window.location.href).href }
      });
      if (error) {
        showMessage(friendlyError(error), "error");
        googleButton.disabled = false;
      }
    });

    form.addEventListener("input", () => showMessage("", ""));
  </script>
</body>
</html>
