<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Alif Laam Meem Jewellers</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">

    <a href="index.html" class="brand">

      <img
        src="assets/logo-icon.png"
        alt="Alif Laam Meem Jewellers"
        class="brand-logo"
      >

      <div class="brand-text">
        <strong>Alif Laam Meem</strong>
        <span>Jewellers</span>
      </div>

    </a>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="collections.html">Collections</a>
      <a href="visit.html">Visit</a>
      <a href="appointment.html" class="book">Book</a>
    </nav>

  </header>


  <main class="login-area">

    <section class="login-card">

      <div class="eyebrow">
        Welcome
      </div>

      <h1>
        Begin your jewellery<br>
        journey.
      </h1>

      <p class="intro">
        Create your Alif Laam Meem account
        and discover our exclusive collection.
      </p>


      <form id="signupForm">

        <div class="field">

          <label for="fullName">
            Full name
          </label>

          <input
            id="fullName"
            type="text"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >

        </div>


        <div class="field">

          <label for="email">
            Email address
          </label>

          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <button
          type="submit"
          class="login-button"
        >
          Create account
        </button>


        <div id="message"></div>

      </form>


      <div class="signup">
        Already have an account?
        <a href="login.html">Sign in</a>
      </div>


      <a href="index.html" class="back">
        ← Back to Alif Laam Meem
      </a>

    </section>

  </main>


  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const supabase = createClient(
      "https://eafqpwwpwzjdrkrtoqlz.supabase.co",
      "sb_publishable_zoi5AWHlAjPn6bx8QOfrPQ_v8vXIHzT"
    );


    const form =
      document.getElementById("signupForm");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", async (event) => {

      event.preventDefault();


      const fullName =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      message.textContent =
        "Creating your account...";


      const { data, error } =
        await supabase.auth.signUp({

          email: email,

          password: password,

          options: {
            data: {
              full_name: fullName
            }
          }

        });


      if (error) {

        message.textContent =
          error.message;

        return;

      }


      if (data.user) {

        message.textContent =
          "Account created. Please check your email to confirm your account.";

        form.reset();

      }

    });

  </script>

</body>
</html>
