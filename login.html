<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Sign in to your Alif Laam Meem Jewellers account.">
  <title>Sign in | Alif Laam Meem Jewellers</title>
  <link rel="icon" href="assets/logo-icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page auth-page--login">
  <nav class="navbar" id="navbar" aria-label="Primary">
    <div class="container nav-container">
      <a class="logo logo--mark" href="index.html" aria-label="Alif Laam Meem Jewellers — home">
        <img class="logo-img logo-img--mark" src="assets/logo-icon.png" alt="" width="192" height="192" decoding="async">
        <span class="logo-words">
          <span class="logo-text">Alif Laam Meem</span>
          <span class="logo-sub">Jewellers</span>
        </span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="collections.html" class="nav-link">Collections</a>
        <a href="visit.html" class="nav-link">Visit</a>
        <a href="login.html" class="nav-link active" aria-current="page">Login</a>
        <a href="appointment.html" class="btn btn-primary nav-cta">Book</a>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Toggle navigation menu"
              aria-expanded="false" aria-controls="navLinks"><span class="hamburger"></span></button>
    </div>
  </nav>

  <main class="auth-main">
    <div class="container auth-container">
      <section class="auth-card" aria-labelledby="authTitle">
        <header class="auth-heading">
          <p class="auth-eyebrow" id="authEyebrow">Welcome back</p>
          <h1 class="auth-title" id="authTitle">Your jewellery journey continues.</h1>
          <p class="auth-intro" id="authDescription">Sign in to access your Alif Laam Meem account and discover your collection.</p>
        </header>

        <form class="auth-form" id="loginForm" method="post">
          <div class="auth-field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" autocapitalize="none" spellcheck="false" required>
          </div>

          <div class="auth-field">
            <div class="auth-field-heading">
              <label for="password">Password</label>
              <button class="auth-inline-action" id="forgotPassword" type="button">Forgot password?</button>
            </div>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          </div>

          <button class="btn btn-primary auth-submit" id="loginButton" type="submit">Sign in</button>
          <p class="auth-message" id="loginMessage" role="status" aria-live="polite" aria-atomic="true" hidden></p>
        </form>

        <form class="auth-form auth-recovery-form" id="recoveryForm" method="post" aria-labelledby="authTitle" hidden>
          <div class="auth-field">
            <label for="recoveryPassword">New password</label>
            <input id="recoveryPassword" name="new-password" type="password" placeholder="Choose a new password" autocomplete="new-password" minlength="6" required>
          </div>
          <button class="btn btn-primary auth-submit" id="recoveryButton" type="submit">Update password</button>
          <p class="auth-message" id="recoveryMessage" role="status" aria-live="polite" aria-atomic="true" hidden></p>
        </form>

        <div class="auth-oauth" id="googleAuthBlock">
          <p class="auth-divider"><span>OR</span></p>

          <button class="btn auth-google" id="googleButton" type="button">
            <span class="auth-google-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" focusable="false" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
              </svg>
            </span>
            <span class="auth-google-label" id="googleButtonLabel">Continue with Google</span>
          </button>

          <p class="auth-message" id="googleMessage" role="status" aria-live="polite" aria-atomic="true" hidden></p>
        </div>

        <p class="auth-switch" id="accountSwitch">New to the house? <a href="signup.html">Create an account</a></p>
        <a class="auth-back" href="index.html">&larr; Back to Alif Laam Meem</a>
      </section>
    </div>
  </main>

  <noscript>
    <p class="auth-noscript">JavaScript is required to securely sign in to your account.</p>
  </noscript>

  <script>
    (() => {
      const button = document.getElementById('mobileMenuBtn');
      const links = document.getElementById('navLinks');
      if (!button || !links) return;

      const setMenu = (open) => {
        button.setAttribute('aria-expanded', String(open));
        links.classList.toggle('open', open);
        document.body.classList.toggle('no-scroll', open);
      };

      button.addEventListener('click', () => {
        setMenu(button.getAttribute('aria-expanded') !== 'true');
      });
      links.querySelectorAll('.nav-link').forEach((link) => {
        link.addEventListener('click', () => setMenu(false));
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && links.classList.contains('open')) {
          setMenu(false);
          button.focus();
        }
      });
      window.addEventListener('resize', () => {
        if (window.innerWidth > 860 && links.classList.contains('open')) setMenu(false);
      });
    })();
  </script>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://eafqpwwpwzjdrkrtoqlz.supabase.co",
      "sb_publishable_zoi5AWHlAjPn6bx8QOfrPQ_v8vXIHzT"
    );

    // Did this page load come back from Google (session in the URL hash) or from
    // a PKCE code exchange? A password-recovery link looks similar, so it is
    // explicitly excluded. Only a provider return forwards into the site.
    const authParams = new URLSearchParams(window.location.search);
    const authHashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const isRecoveryLink = authHashParams.get("type") === "recovery" || authParams.get("type") === "recovery";
    const returnedFromProvider = !isRecoveryLink
      && (authHashParams.has("access_token") || authParams.has("code"));

    const loginForm = document.getElementById("loginForm");
    const recoveryForm = document.getElementById("recoveryForm");
    const loginMessage = document.getElementById("loginMessage");
    const recoveryMessage = document.getElementById("recoveryMessage");
    const loginButton = document.getElementById("loginButton");
    const recoveryButton = document.getElementById("recoveryButton");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const recoveryPassword = document.getElementById("recoveryPassword");
    const forgotPasswordButton = document.getElementById("forgotPassword");
    const accountSwitch = document.getElementById("accountSwitch");
    const googleAuthBlock = document.getElementById("googleAuthBlock");
    const googleButton = document.getElementById("googleButton");
    const googleButtonLabel = document.getElementById("googleButtonLabel");
    const googleMessage = document.getElementById("googleMessage");
    const googleButtonText = googleButtonLabel.textContent.trim() || "Continue with Google";
    const authEyebrow = document.getElementById("authEyebrow");
    const authTitle = document.getElementById("authTitle");
    const authDescription = document.getElementById("authDescription");

    function showMessage(element, text, state) {
      element.textContent = text;
      element.dataset.state = state;
      element.hidden = !text;
    }

    function friendlyError(error, fallback) {
      const original = error && error.message ? error.message : "";
      const normalized = original.toLowerCase();
      if (normalized.includes("invalid login credentials")) {
        return "The email address or password is incorrect. Check your details or request a password reset.";
      }
      if (normalized.includes("email not confirmed") || normalized.includes("email_not_confirmed")) {
        return "Please confirm your email using the link we sent before signing in.";
      }
      if (normalized.includes("too many") || normalized.includes("rate limit")) {
        return "There have been too many attempts. Please wait a moment and try again.";
      }
      if (normalized.includes("failed to fetch") || normalized.includes("network")) {
        return "We couldn't reach the account service. Check your connection and try again.";
      }
      return original || fallback;
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage(loginMessage, "", "");

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const originalLabel = loginButton.textContent;
      loginButton.disabled = true;
      loginButton.textContent = "Signing in…";

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          showMessage(loginMessage, friendlyError(error, "We couldn't sign you in. Please try again."), "error");
          return;
        }
        if (!data.session) {
          showMessage(loginMessage, "We couldn't start your session. Please try again.", "error");
          return;
        }
        window.location.replace("index.html");
      } catch (error) {
        showMessage(loginMessage, friendlyError(error, "We couldn't sign you in. Please try again."), "error");
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = originalLabel;
      }
    });

    // The Google button carries an SVG icon, so its label is swapped by text
    // rather than by replacing textContent (which would drop the icon).
    function setLoading(button, labelElement, text) {
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
      labelElement.textContent = text;
    }

    function clearLoading(button, labelElement, label) {
      button.disabled = false;
      button.removeAttribute("aria-busy");
      labelElement.textContent = label;
    }

    function friendlyOAuthError(error, fallback) {
      const original = error && error.message ? error.message : "";
      const normalized = original.toLowerCase();
      if (normalized.includes("provider is not enabled") || normalized.includes("unsupported provider")) {
        return "Google sign-in is not available right now. Please sign in with your email and password.";
      }
      if (normalized.includes("popup") || normalized.includes("closed")) {
        return "The Google sign-in window was closed before it finished. Please try again.";
      }
      if (normalized.includes("too many") || normalized.includes("rate limit")) {
        return "There have been too many attempts. Please wait a moment and try again.";
      }
      if (normalized.includes("failed to fetch") || normalized.includes("network")) {
        return "We couldn't reach Google or the account service. Check your connection and try again.";
      }
      return original || fallback;
    }

    googleButton.addEventListener("click", async () => {
      showMessage(googleMessage, "", "");
      showMessage(loginMessage, "", "");
      if (googleButton.disabled) return;

      setLoading(googleButton, googleButtonLabel, "Connecting to Google…");
      try {
        // Existing client, existing project URL and publishable key — reused,
        // never re-created. The Google client secret lives only in Supabase.
        const { error } = await supabase.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: window.location.origin + "/login.html",
            queryParams: { prompt: "select_account" }
          }
        });

        if (error) {
          showMessage(googleMessage, friendlyOAuthError(error, "We couldn't start Google sign-in. Please try again or sign in with your email."), "error");
          clearLoading(googleButton, googleButtonLabel, googleButtonText);
          return;
        }

        // No error means the browser is being handed over to Google. The button
        // stays in its loading state so the page cannot be double-submitted.
        showMessage(googleMessage, "Taking you to Google to finish signing in…", "loading");
      } catch (error) {
        showMessage(googleMessage, friendlyOAuthError(error, "We couldn't start Google sign-in. Please try again or sign in with your email."), "error");
        clearLoading(googleButton, googleButtonLabel, googleButtonText);
      }
    });

    // A failed OAuth round-trip comes back from Supabase in the query string or
    // the hash. Never touch healthy callback parameters — supabase-js still
    // needs them — only report the error and tidy up after it.
    (function reportRedirectError() {
      const description = authParams.get("error_description") || authParams.get("error")
        || authHashParams.get("error_description") || authHashParams.get("error");
      if (!description || returnedFromProvider) return;

      showMessage(
        googleMessage,
        friendlyOAuthError({ message: description }, "Google sign-in didn't complete. Please try again or sign in with your email."),
        "error"
      );

      if (window.history.replaceState) {
        const cleanHash = authHashParams.has("error") || authHashParams.has("error_description") ? "" : window.location.hash;
        window.history.replaceState({}, document.title, window.location.pathname + cleanHash);
      }
    })();

    forgotPasswordButton.addEventListener("click", async () => {
      showMessage(loginMessage, "", "");
      const email = emailInput.value.trim();
      if (!email) {
        showMessage(loginMessage, "Enter your email address above, then choose Forgot password?", "error");
        emailInput.focus();
        return;
      }
      if (!emailInput.checkValidity()) {
        emailInput.reportValidity();
        emailInput.focus();
        return;
      }

      const originalLabel = forgotPasswordButton.textContent;
      forgotPasswordButton.disabled = true;
      forgotPasswordButton.textContent = "Sending link…";
      try {
        const redirectTo = new URL("login.html", window.location.href).href;
        const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
        if (error) {
          showMessage(loginMessage, friendlyError(error, "We couldn't send a reset link. Please try again."), "error");
          return;
        }
        showMessage(loginMessage, "If an account exists for this email, a password reset link will be sent. Please check your inbox and spam folder.", "success");
      } catch (error) {
        showMessage(loginMessage, friendlyError(error, "We couldn't send a reset link. Please try again."), "error");
      } finally {
        forgotPasswordButton.disabled = false;
        forgotPasswordButton.textContent = originalLabel;
      }
    });

    recoveryForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage(recoveryMessage, "", "");

      const originalLabel = recoveryButton.textContent;
      recoveryButton.disabled = true;
      recoveryButton.textContent = "Updating…";
      try {
        const { error } = await supabase.auth.updateUser({ password: recoveryPassword.value });
        if (error) {
          showMessage(recoveryMessage, friendlyError(error, "We couldn't update your password. Please try again."), "error");
          return;
        }
        showMessage(recoveryMessage, "Your password has been updated. Returning to Alif Laam Meem…", "success");
        window.setTimeout(() => window.location.replace("index.html"), 900);
      } catch (error) {
        showMessage(recoveryMessage, friendlyError(error, "We couldn't update your password. Please try again."), "error");
      } finally {
        recoveryButton.disabled = false;
        recoveryButton.textContent = originalLabel;
      }
    });

    loginForm.addEventListener("input", () => showMessage(loginMessage, "", ""));
    recoveryForm.addEventListener("input", () => showMessage(recoveryMessage, "", ""));

    supabase.auth.onAuthStateChange((event, session) => {
      // Google OAuth returns to this page with the session in the URL. supabase-js
      // picks it up and emits SIGNED_IN — send the visitor straight into the
      // existing authenticated flow so they never sign in twice.
      if (event === "SIGNED_IN" && session && returnedFromProvider) {
        window.location.replace("index.html");
        return;
      }
      if (event !== "PASSWORD_RECOVERY") return;
      loginForm.hidden = true;
      recoveryForm.hidden = false;
      googleAuthBlock.hidden = true;
      accountSwitch.hidden = true;
      authEyebrow.textContent = "Password reset";
      authTitle.textContent = "Choose a new password.";
      authDescription.textContent = "Create a new password to securely return to your account.";
      window.setTimeout(() => recoveryPassword.focus(), 0);
    });
  </script>
</body>
</html>
